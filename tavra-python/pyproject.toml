[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tavra"
version = "0.1.0"
description = "Python bindings for Tavra — a readable data/config format with a canonical binary form and an encrypted, signed envelope"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/SkuldNorniern/tavra"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "tavra"
