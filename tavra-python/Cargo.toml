[package]
name = "tavra-python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for Tavra"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/tavra"

[lib]
# Not "tavra" — that collides with the root package's `tavra` CLI binary
# output (both would write target/debug/deps/tavra.pdb on Windows,
# which fails the build under concurrent/parallel compilation: LNK1201,
# "error writing to program database"). pyproject.toml's
# `module-name = "tavra"` is what actually controls the published wheel's
# import name — maturin renames independently of this Cargo-level name.
name = "tavra_python"
crate-type = ["cdylib"]

[dependencies]
tavra = { path = "..", version = "0.1.0" }
pyo3 = { version = "0.27", features = ["extension-module"] }

[lints]
workspace = true
