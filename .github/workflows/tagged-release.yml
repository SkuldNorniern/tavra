name: Tagged Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tavra
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tavra
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tavra.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package and checksum
        shell: bash
        run: |
          BINARY=target/${{ matrix.target }}/release/${{ matrix.artifact }}
          ARCHIVE=tavra-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p dist
          cp "$BINARY" dist/
          cp LICENSE README.md dist/

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cd dist && 7z a "../${ARCHIVE}.zip" . && cd ..
            sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"
          else
            tar -czf "${ARCHIVE}.tar.gz" -C dist .
            sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tavra-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  c-archive:
    name: Build C archive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-c-tagged-${{ hashFiles('tavra-c/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-c-tagged-

      - name: Test C API and run the C smoke test
        run: |
          cd tavra-c
          make test

      - name: Package C archive
        run: |
          cargo build --release -p tavra-c
          ARCHIVE=tavra-c-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          mkdir -p dist/{lib,include}
          cp target/release/libtavra_c.a target/release/libtavra_c.so dist/lib/
          cp tavra-c/include/tavra.h dist/include/
          cp LICENSE dist/
          tar -czf "${ARCHIVE}.tar.gz" -C dist .
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: tavra-c-x86_64-unknown-linux-gnu
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  c-native-libs:
    name: Build tavra-c native lib (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
            lib: libtavra_c.so
          # Cross-compiled (apt gcc-aarch64-linux-gnu on an x86_64 runner) —
          # built but not smoke-tested, no aarch64-linux runner available.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64
            lib: libtavra_c.so
          - os: macos-latest
            target: aarch64-apple-darwin
            rid: osx-arm64
            lib: libtavra_c.dylib
          # Cross-compiled on the same (Apple Silicon) runner via Xcode's
          # universal clang — built but not smoke-tested on real x86_64
          # macOS hardware.
          - os: macos-latest
            target: x86_64-apple-darwin
            rid: osx-x64
            lib: libtavra_c.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
            lib: tavra_c.dll
          # Cross-compiled via the MSVC ARM64 toolset — unverified, GitHub's
          # windows-latest runner image support for this target hasn't been
          # confirmed by hand; watch this leg specifically on first real run.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            rid: win-arm64
            lib: tavra_c.dll

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile linker (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-nuget-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-nuget-cargo-

      - name: Build tavra-c
        run: cargo build --release --target ${{ matrix.target }} -p tavra-c

      - uses: actions/upload-artifact@v4
        with:
          name: tavra-c-native-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

      # Per-platform C archive (dynamic lib + header + LICENSE), macOS/
      # Windows only — Linux is already covered by the c-archive job
      # above (make-test-verified). Skipping linux-x64 here avoids
      # producing a second archive with the identical filename
      # (tavra-c-<tag>-x86_64-unknown-linux-gnu.tar.gz), which would
      # silently clobber the verified one when the release job's
      # download-artifact step flattens all artifacts into one dir.
      # These two (macOS/Windows) are built but not smoke-tested, since
      # the Makefile's linker flags (-lpthread -ldl) are Linux-specific
      # and haven't been verified to work as-is on those platforms.
      - name: Package C archive
        if: matrix.rid != 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist/include
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" dist/
          cp tavra-c/include/tavra.h dist/include/
          cp LICENSE dist/
          ARCHIVE=tavra-c-${{ github.ref_name }}-${{ matrix.target }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cd dist && 7z a "../${ARCHIVE}.zip" . && cd ..
            sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"
          else
            tar -czf "${ARCHIVE}.tar.gz" -C dist .
            sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.rid != 'linux-x64'
        with:
          name: tavra-c-archive-${{ matrix.rid }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  python-wheel:
    name: Build Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The manylinux container ships many CPython versions and
          # defaults to the oldest one satisfying requires-python (3.9)
          # unless pinned — confirmed for real in a CI run, the unpinned
          # build produced a cp39 wheel, not the cp312 this project is
          # actually tested against. macOS/Windows build natively against
          # whatever actions/setup-python installed (3.12), so they don't
          # need the same pin.
          - os: ubuntu-latest
            args: --release --out dist --interpreter python3.12
          - os: macos-latest
            args: --release --out dist
          - os: windows-latest
            args: --release --out dist

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Built with maturin-action rather than a hand-rolled `pip install
      # maturin && maturin build`, since it already handles the manylinux
      # container image for Linux wheels correctly — not something worth
      # reimplementing by hand.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: tavra-python
          command: build
          args: ${{ matrix.args }}
          manylinux: auto

      # Single Python-version build (3.12, matching the version this repo
      # has actually been tested against — see requires-python's <3.14 cap
      # in pyproject.toml). Not abi3, so this wheel only installs on 3.12.
      # A real PyPI release needs either a full cp3x version matrix or
      # switching pyo3 to the abi3 feature — tracked as follow-up, not done
      # here.
      # maturin-action's manylinux build runs inside a container as root,
      # so dist/ (and the .whl in it) end up root-owned — the checksum
      # step below runs as the normal runner user and can't write into
      # it without this. Linux-only: macOS/Windows build natively, no
      # container involved.
      - name: Fix dist ownership (manylinux container runs as root)
        if: runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" tavra-python/dist

      - name: Checksum
        shell: bash
        run: |
          cd tavra-python/dist
          for f in *.whl; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: tavra-wheel-${{ matrix.os }}
          path: |
            tavra-python/dist/*.whl
            tavra-python/dist/*.whl.sha256
          if-no-files-found: error

  csharp-unity-archive:
    name: Package C# Unity archive
    needs: c-native-libs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Tavra.dll
        run: dotnet build tavra-csharp/Tavra/Tavra.csproj -c Release

      - uses: actions/download-artifact@v4
        with:
          pattern: tavra-c-native-*
          path: native-artifacts

      # Simplified per-OS Plugins layout (Linux/Linux-ARM64/macOS/
      # macOS-x64/Windows/Windows-ARM64), matching what's documented by
      # hand in ~/Release/howto.md — not per-file Unity plugin importer
      # settings (.meta), which Unity projects normally configure
      # per-platform themselves after import.
      - name: Assemble Unity plugin archive
        run: |
          mkdir -p dist/Plugins/{Linux,Linux-ARM64,macOS,macOS-x64,Windows,Windows-ARM64}
          cp tavra-csharp/Tavra/bin/Release/netstandard2.1/Tavra.dll dist/
          cp native-artifacts/tavra-c-native-linux-x64/libtavra_c.so dist/Plugins/Linux/
          cp native-artifacts/tavra-c-native-linux-arm64/libtavra_c.so dist/Plugins/Linux-ARM64/
          cp native-artifacts/tavra-c-native-osx-arm64/libtavra_c.dylib dist/Plugins/macOS/
          cp native-artifacts/tavra-c-native-osx-x64/libtavra_c.dylib dist/Plugins/macOS-x64/
          cp native-artifacts/tavra-c-native-win-x64/tavra_c.dll dist/Plugins/Windows/
          cp native-artifacts/tavra-c-native-win-arm64/tavra_c.dll dist/Plugins/Windows-ARM64/
          cp LICENSE dist/
          ARCHIVE=tavra-csharp-unity-${{ github.ref_name }}
          tar -czf "${ARCHIVE}.tar.gz" -C dist .
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: tavra-csharp-unity-archive
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  pack-nuget:
    name: Pack NuGet package
    needs: c-native-libs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          pattern: tavra-c-native-*
          path: native-artifacts

      - name: Stage native libs for packing
        run: |
          mkdir -p tavra-csharp/Tavra/native/linux-x64
          mkdir -p tavra-csharp/Tavra/native/linux-arm64
          mkdir -p tavra-csharp/Tavra/native/osx-arm64
          mkdir -p tavra-csharp/Tavra/native/osx-x64
          mkdir -p tavra-csharp/Tavra/native/win-x64
          mkdir -p tavra-csharp/Tavra/native/win-arm64
          cp native-artifacts/tavra-c-native-linux-x64/libtavra_c.so tavra-csharp/Tavra/native/linux-x64/
          cp native-artifacts/tavra-c-native-linux-arm64/libtavra_c.so tavra-csharp/Tavra/native/linux-arm64/
          cp native-artifacts/tavra-c-native-osx-arm64/libtavra_c.dylib tavra-csharp/Tavra/native/osx-arm64/
          cp native-artifacts/tavra-c-native-osx-x64/libtavra_c.dylib tavra-csharp/Tavra/native/osx-x64/
          cp native-artifacts/tavra-c-native-win-x64/tavra_c.dll tavra-csharp/Tavra/native/win-x64/
          cp native-artifacts/tavra-c-native-win-arm64/tavra_c.dll tavra-csharp/Tavra/native/win-arm64/

      - name: Compute package version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: dotnet pack
        run: dotnet pack tavra-csharp/Tavra/Tavra.csproj -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Checksum
        run: |
          cd tavra-csharp/Tavra/bin/Release
          for f in *.nupkg; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: tavra-nuget-package
          path: |
            tavra-csharp/Tavra/bin/Release/*.nupkg
            tavra-csharp/Tavra/bin/Release/*.nupkg.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, c-archive, pack-nuget, python-wheel, csharp-unity-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          # Find the previous versioned tag (skip the tag we're currently cutting).
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          [ -z "$PREV_TAG" ] && RANGE="HEAD"

          section() {
            git log "$RANGE" --pretty=format:"%s" \
              | grep -E "^${1}(\([^)]*\))?: " \
              | sed -E "s/^${1}(\([^)]*\))?: /- /" \
              || true
          }

          FEATS=$(section feat)
          FIXES=$(section fix)
          DOCS=$(section docs)
          REFACTORS=$(section refactor)
          STYLE=$(section style)
          OTHERS=$(git log "$RANGE" --pretty=format:"%s" \
            | grep -Ev "^(feat|fix|docs|refactor|style|ci|chore|test|perf|build)(\([^)]*\))?: " \
            || true)

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$FEATS" ];     then echo "### Features";      echo "$FEATS";     echo ""; fi
            if [ -n "$FIXES" ];     then echo "### Bug Fixes";     echo "$FIXES";     echo ""; fi
            if [ -n "$REFACTORS" ]; then echo "### Refactor";      echo "$REFACTORS"; echo ""; fi
            if [ -n "$DOCS" ];      then echo "### Documentation"; echo "$DOCS";      echo ""; fi
            if [ -n "$STYLE" ];     then echo "### Style";         echo "$STYLE";     echo ""; fi
            if [ -n "$OTHERS" ];    then echo "### Other";         echo "$OTHERS" | sed 's/^/- /'; echo ""; fi
          } > CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: find artifacts -name "*.sha256" -exec cat {} \; | sort > checksums.sha256

      - name: Publish release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          title: "Tavra ${{ github.ref_name }}"
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.nupkg
            artifacts/*.whl
            checksums.sha256

      - name: Update release notes with changelog and downloads table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | File | SHA256 |"
            echo "|----------|------|--------|"
            while read -r hash file; do
              case "$file" in
                *.nupkg)                                platform="NuGet (multi-platform)"       ;;
                *unity*)                                platform="C# Unity archive (multi-platform)" ;;
                *.whl)                                  platform="Python wheel (3.12)"           ;;
                tavra-c-*x86_64-unknown-linux-gnu*)      platform="C API (Linux x86_64)"          ;;
                tavra-c-*aarch64-unknown-linux-gnu*)     platform="C API (Linux ARM64)"           ;;
                tavra-c-*aarch64-apple-darwin*)          platform="C API (macOS ARM64)"           ;;
                tavra-c-*x86_64-apple-darwin*)           platform="C API (macOS x86_64)"          ;;
                tavra-c-*x86_64-pc-windows-msvc*)        platform="C API (Windows x86_64)"        ;;
                tavra-c-*aarch64-pc-windows-msvc*)       platform="C API (Windows ARM64)"         ;;
                *x86_64-unknown-linux-gnu*)              platform="CLI (Linux x86_64)"            ;;
                *aarch64-apple-darwin*)                  platform="CLI (macOS ARM64)"             ;;
                *x86_64-pc-windows-msvc*)                platform="CLI (Windows x86_64)"          ;;
                *)                                       platform="Other"                         ;;
              esac
              echo "| $platform | \`$file\` | \`${hash:0:16}...\` |"
            done < checksums.sha256
          } > notes.md
          gh release edit ${{ github.ref_name }} --notes-file notes.md
