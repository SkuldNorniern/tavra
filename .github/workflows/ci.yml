name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Python (for tavra-python)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install .NET SDK (for tavra-csharp)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # pyo3's `extension-module` feature (tavra-python) deliberately
      # doesn't link libpython — it expects those symbols to resolve at
      # Python's dlopen time. Linux tolerates undefined symbols in a
      # cdylib by default; macOS's linker doesn't, and fails the whole
      # workspace build without this. Scoped to macOS only so it can't
      # mask a real link error in tavra/tavra-c.
      - name: Defer undefined-symbol resolution on macOS (pyo3 extension-module)
        if: runner.os == 'macOS'
        run: echo "RUSTFLAGS=-C link-arg=-undefined -C link-arg=dynamic_lookup" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and test C# bindings (tavra-csharp)
        shell: bash
        run: |
          dotnet build tavra-csharp/Tavra.slnx
          case "${{ runner.os }}" in
            Linux)   export LD_LIBRARY_PATH="$PWD/target/debug:$LD_LIBRARY_PATH" ;;
            macOS)   export DYLD_LIBRARY_PATH="$PWD/target/debug:$DYLD_LIBRARY_PATH" ;;
            Windows) export PATH="$PWD/target/debug:$PATH" ;;
          esac
          dotnet test tavra-csharp/Tavra.Tests/Tavra.Tests.csproj

  nightly:
    name: Nightly Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/nightly.yml
    permissions:
      contents: write
    secrets: inherit
