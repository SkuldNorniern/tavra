name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Python (for tavra-python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install .NET SDK (for tavra-csharp)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and test C# bindings (tavra-csharp)
        shell: bash
        run: |
          dotnet build tavra-csharp/Tavra.slnx
          case "${{ runner.os }}" in
            Linux)   export LD_LIBRARY_PATH="$PWD/target/debug:$LD_LIBRARY_PATH" ;;
            macOS)   export DYLD_LIBRARY_PATH="$PWD/target/debug:$DYLD_LIBRARY_PATH" ;;
            Windows) export PATH="$PWD/target/debug:$PATH" ;;
          esac
          dotnet test tavra-csharp/Tavra.Tests/Tavra.Tests.csproj
