[workspace]
resolver = "3"
members = ["tavra-c", "tavra-python"]

[package]
name = "tavra"
version = "0.1.0"
edition = "2024"
description = "A readable data/config format with a canonical binary form and an encrypted, signed envelope"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/tavra"
readme = "README.md"
keywords = ["serialization", "config", "encryption", "binary-format"]
categories = ["encoding", "parser-implementations", "cryptography"]

[workspace.lints.clippy]
absolute_paths = "deny"
result_large_err = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"

[lints]
workspace = true

[dependencies]
argon2 = "0.5.3"
blake3 = "1.8.5"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
rand = "0.10.2"
saphyr = "0.0.11"
serde_json = "1.0.150"
toml = "1.1.2"
zstd = "0.13.3"
