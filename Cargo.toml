[workspace]
resolver = "3"
members = ["tavra-c", "tavra-python"]

[package]
name = "tavra"
version = "0.1.0"
edition = "2024"
description = "A readable data/config format with a canonical binary form and an encrypted, signed envelope"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/tavra"
readme = "README.md"
keywords = ["serialization", "config", "encryption", "binary-format"]
categories = ["encoding", "parser-implementations", "cryptography"]

[workspace.lints.clippy]
absolute_paths = "deny"
result_large_err = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"

[lints]
workspace = true

[features]
default = ["binary", "envelope", "json", "toml", "yaml"]
binary = ["dep:blake3"]
envelope = [
    "binary",
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:ed25519-dalek",
    "dep:rand",
    "dep:zstd",
]
json = ["dep:serde_json"]
toml = ["dep:toml"]
yaml = ["dep:saphyr"]

[dependencies]
argon2 = { version = "0.5.3", optional = true }
blake3 = { version = "1.8.5", optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true }
ed25519-dalek = { version = "3.0.0", optional = true }
rand = { version = "0.10.2", optional = true }
saphyr = { version = "0.0.11", optional = true }
serde_json = { version = "1.0.150", optional = true }
toml = { version = "1.1.2", optional = true }
zstd = { version = "0.13.3", optional = true }

[[bin]]
name = "tavra"
path = "src/main.rs"
required-features = ["binary", "envelope", "json", "toml", "yaml"]
